<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2a66" />

    <!-- ✅ Favicon and App Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/images/SheveCity.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="%PUBLIC_URL%/images/SheveCity.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="%PUBLIC_URL%/images/SheveCity.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/images/SheveCity.png"
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ SEO Meta Tags (Shevet City Media) -->
    <meta
      name="title"
      content="Shevet City Media – Digital Innovation & Media Solutions"
    />
    <meta
      name="description"
      content="Shevet City Media provides cutting-edge digital solutions including web development, branding, media production, and online growth strategies for businesses and organizations."
    />
    <meta
      name="keywords"
      content="Shevet City Media, Digital Agency Nigeria, Web Development, Branding, Media Production, Digital Marketing, Lagos Tech, Business Solutions"
    />
    <meta name="author" content="Shevet City Media" />

    <!-- ✅ Open Graph Meta (Social Sharing) -->
    <meta
      property="og:title"
      content="Shevet City Media – Digital Innovation & Media Solutions"
    />
    <meta
      property="og:description"
      content="We help businesses grow through technology, branding, and media. Discover Shevet City Media’s services and solutions."
    />
    <meta
      property="og:image"
      content="%PUBLIC_URL%/images/SheveCity.png"
    />
    <meta
      property="og:url"
      content="https://shevet-citymedia.com"
    />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Shevet City Media – Digital Innovation & Media Solutions"
    />
    <meta
      name="twitter:description"
      content="Explore Shevet City Media: web development, branding, media production, and digital growth strategies."
    />
    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/images/SheveCity.png"
    />

    <title>Shevet City Media</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
